# Deployed by GitLab CI — __NAMESPACE__ and __IMAGE__ are substituted at deploy time.
# See usecase4-deployk8s.md and usecase6-devprodstages.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kkm-pulse-demo
  namespace: __NAMESPACE__
  labels:
    app: kkm-pulse-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kkm-pulse-demo
  template:
    metadata:
      labels:
        app: kkm-pulse-demo
    spec:
      containers:
        - name: kkm-pulse-demo
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kkm-pulse-demo
  namespace: __NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app: kkm-pulse-demo
  ports:
    - port: 3000
      targetPort: 3000
